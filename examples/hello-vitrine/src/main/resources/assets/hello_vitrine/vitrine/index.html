<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; background: transparent; font: 15px system-ui, sans-serif; color: #fff; }
  .card { position: fixed; left: 16px; bottom: 80px; padding: 10px 14px; border-radius: 8px;
          background: rgba(12, 14, 20, .78); border: 1px solid rgba(255, 255, 255, .12); min-width: 180px; }
  .bar { height: 6px; border-radius: 3px; background: #2a2d34; margin-top: 6px; overflow: hidden; }
  .bar div { height: 100%; background: #e5534b; transform: scaleX(0); transform-origin: left; transition: transform .3s; }
  .hint { font-size: 12px; opacity: .6; margin-top: 6px; }
  #panel { display: none; margin-top: 10px; }
  body.focused { background: rgba(0, 0, 0, .3); }
  body.focused #panel { display: block; }
  body.focused .hint { display: none; }
  input { font: inherit; width: 160px; padding: 4px 6px; border-radius: 5px; border: 1px solid #556; background: #0b1020; color: #fff; }
  button { font: inherit; padding: 4px 10px; border-radius: 5px; border: 0; background: #4da3ff; color: #000; cursor: pointer; }
  #reply { margin-top: 6px; font-size: 13px; opacity: .85; }
</style>
</head>
<body>
  <div class="card">
    <div>Health: <span id="hp">–</span></div>
    <div class="bar"><div id="fill"></div></div>
    <div class="hint">Press H to open</div>
    <div id="panel">
      <input id="msg" value="hi">
      <button id="send">Greet</button>
      <button id="close">Close</button>
      <div id="reply"></div>
    </div>
  </div>
<script>
  // Java -> page.
  addEventListener('message', e => {
    const { health, max } = e.data;
    hp.textContent = `${health} / ${max}`;
    fill.style.transform = `scaleX(${health / max})`;
  });

  // Page -> Java: POST to vitrine://<modid>/<handler>.
  const java = (name, data) => fetch(`vitrine://hello_vitrine/${name}`, { method: 'POST', body: JSON.stringify(data ?? {}) })
    .then(r => r.ok ? r.json() : r.text().then(t => Promise.reject(new Error(t))));
  send.onclick = async () => {
    try {
      const r = await java('greet', { msg: msg.value });
      reply.textContent = `${r.text} You sent: ${JSON.stringify(r.got)}`;
    } catch (err) {
      reply.textContent = `error: ${err.message}`;
    }
  };
  close.onclick = () => java('close');

  // Vitrine gives the page focus while it has the mouse and keyboard.
  addEventListener('focus', () => { document.body.classList.add('focused'); msg.focus(); });
  addEventListener('blur', () => document.body.classList.remove('focused'));
</script>
</body>
</html>
