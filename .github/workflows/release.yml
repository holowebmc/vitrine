name: release

# Builds vitrine.dll, vitrine_helper.exe and every jar from this repository. Pushing a v<mod.version> tag
# also uploads those same jars to Modrinth and to a GitHub release: the files players download are this
# workflow's output, never built on a developer's machine. The run summary and the release's SHA512SUMS
# list their SHA-512, which Modrinth shows per file.
on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # the GitHub release
  id-token: write # build provenance
  attestations: write

jobs:
  build:
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false # same bytes as the repository, also inside the jars
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      # The archive the mod itself downloads on first launch, with the SHA-256 it checks (impl/CefRuntime.java).
      - name: CEF
        run: |
          src=src/main/java/dev/holoweb/vitrine/impl/CefRuntime.java
          archive=$(sed -n 's/.*String ARCHIVE = "\(.*\)";.*/\1/p' $src)
          sha=$(sed -n 's/.*String SHA256 = "\(.*\)";.*/\1/p' $src)
          curl -fL --retry 3 -o cef.tar.bz2 "https://cef-builds.spotifycdn.com/${archive//+/%2B}.tar.bz2"
          echo "$sha *cef.tar.bz2" | sha256sum -c
          mkdir -p native/third_party/cef
          tar -xjf cef.tar.bz2 --strip-components=1 -C native/third_party/cef

      - name: Native
        run: |
          cmake -S native -B native/build -G "Visual Studio 18 2026" -A x64
          cmake --build native/build --config Release
          ctest --test-dir native/build -C Release --output-on-failure

      - name: Jars
        run: ./gradlew build

      - name: Hashes
        run: |
          mkdir dist
          cp versions/*/build/libs/vitrine-*.jar native/build/out/vitrine.dll native/build/out/vitrine_helper.exe dist/
          rm dist/*-sources.jar
          cd dist
          sha512sum *.jar *.dll *.exe > SHA512SUMS
          { echo '### SHA-512'; echo '```'; cat SHA512SUMS; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: vitrine
          path: dist

      - uses: actions/attest-build-provenance@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          subject-path: dist/*.jar

      - name: Publish to Modrinth and GitHub
        if: startsWith(github.ref, 'refs/tags/')
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^mod.version=//p' gradle.properties)
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "tag $GITHUB_REF_NAME is not v$version (gradle.properties)"; exit 1; }
          repo=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY
          export MODRINTH_CHANGELOG="$(awk -v h="## $version" '$0 == h { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md)

          Built by GitHub Actions from commit [${GITHUB_SHA::7}]($repo/tree/$GITHUB_SHA) ([run]($repo/actions/runs/$GITHUB_RUN_ID)); SHA-512 sums in the [release]($repo/releases/tag/$GITHUB_REF_NAME)."
          ./gradlew modrinth
          gh release create "$GITHUB_REF_NAME" dist/* --title "Vitrine $version" --notes "$MODRINTH_CHANGELOG"
